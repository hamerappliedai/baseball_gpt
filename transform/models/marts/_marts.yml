# Mart documentation and tests. Descriptions are persisted to Postgres as
# COMMENTs (persist_docs), which is how Claude learns the schema.
version: 2
models:
- name: players
  description: 'One row per person: every player, plus managers, umpires and executives who appear only in manager
    or Hall of Fame records. Start here to resolve a name to a player_id.'
  columns:
  - name: player_id
    description: "{{ doc('player_id') }}"
    data_tests:
    - unique
    - not_null
  - name: full_name
    description: "{{ doc('full_name') }}"
    data_tests:
    - not_null
  - name: name_first
    description: First name as commonly known (e.g. 'Babe'). NULL for some Negro Leagues players.
  - name: name_last
    description: Last name.
    data_tests:
    - not_null
  - name: name_given
    description: Full given name (e.g. 'George Herman').
  - name: birth_date
    description: Date of birth; NULL when any part is unknown.
  - name: birth_year
    description: Year of birth.
  - name: birth_city
    description: Birth city.
  - name: birth_state
    description: Birth state or province.
  - name: birth_country
    description: Birth country.
  - name: death_date
    description: Date of death; NULL if living or unknown.
  - name: death_year
    description: Year of death; NULL if living or unknown.
  - name: death_city
    description: Death city.
  - name: death_state
    description: Death state or province.
  - name: death_country
    description: Death country.
  - name: bats
    description: 'Batting hand: R, L or B (both).'
  - name: throws
    description: 'Throwing hand: R, L, or rarely S/B.'
  - name: height_in
    description: Height in inches.
  - name: weight_lbs
    description: Weight in pounds.
  - name: debut_date
    description: Date of first major league game.
  - name: final_game_date
    description: Date of last major league game.
  - name: first_season
    description: First season with a playing appearance; NULL for non-players.
  - name: last_season
    description: Last season with a playing appearance; NULL for non-players.
  - name: seasons_played
    description: Number of seasons with a playing appearance.
  - name: games_played
    description: Career games played (regular season).
  - name: primary_position
    description: 'Position with the most career games: P, C, 1B, 2B, 3B, SS, LF, CF, RF or DH.'
  - name: teams
    description: Team names played for, in the order the player joined them.
  - name: played_negro_leagues
    description: True if the player appeared for a Negro Leagues or Black independent club.
  - name: is_player
    description: True if the person has any playing appearance.
  - name: is_manager
    description: True if the person managed a team.
  - name: is_hall_of_famer
    description: True if inducted into the Hall of Fame (in any category).
  - name: hof_induction_year
    description: Year inducted into the Hall of Fame.
  - name: hof_category
    description: 'Hall of Fame induction category: Player, Manager, Executive, Pioneer/Executive or Umpire.'
  - name: hof_voted_by
    description: Body that elected the person (e.g. 'BBWAA', 'Veterans').
  - name: bbref_id
    description: Baseball-Reference player id.
  - name: retro_id
    description: Retrosheet player id.
- name: leagues
  description: Major leagues recognized by SABR, including the Negro Leagues (1920-1950) and Black independent clubs
    (1891-1936), which are grouped into pseudo-leagues.
  columns:
  - name: league_id
    description: League id used across all tables.
    data_tests:
    - unique
    - not_null
  - name: league_name
    description: League name.
  - name: is_negro_leagues
    description: True for Negro Leagues and Black independent clubs.
  - name: is_independent_clubs
    description: True for the pseudo-leagues IND, EAS and WES, which group independent clubs rather than a real
      league.
  - name: first_season
    description: First season.
  - name: last_season
    description: Last season; NULL if active.
- name: franchises
  description: 'One row per franchise: a club''s identity across relocations and renames (e.g. the Brooklyn and
    Los Angeles Dodgers are franchise LAD).'
  columns:
  - name: franchise_id
    description: Franchise id.
    data_tests:
    - unique
    - not_null
  - name: franchise_name
    description: Franchise name.
  - name: is_active
    description: True for current MLB franchises.
  - name: latest_team_name
    description: Team name in the franchise's most recent season.
  - name: first_season
    description: "{{ doc('first_season') }}"
  - name: last_season
    description: "{{ doc('last_season') }}"
  - name: seasons
    description: Seasons played.
  - name: w
    description: Total wins.
  - name: l
    description: Total losses.
  - name: win_pct
    description: All-time winning percentage.
  - name: pennants
    description: League pennants won.
  - name: world_series_titles
    description: World Series titles won.
  - name: team_names
    description: All team names the franchise has used.
- name: team_seasons
  description: 'One row per team per season: record, standings, postseason results and team batting, pitching and
    fielding totals.'
  columns:
  - name: season
    description: "{{ doc('season') }}"
    data_tests:
    - not_null
  - name: team_id
    description: "{{ doc('team_id') }}"
    data_tests:
    - not_null
  - name: team_name
    description: Team name that season (e.g. 'Brooklyn Dodgers').
  - name: franchise_id
    description: Franchise id. Use it to follow a club across relocations.
    data_tests:
    - relationships:
        arguments:
          to: ref('franchises')
          field: franchise_id
  - name: franchise_name
    description: Current or final franchise name.
  - name: league_id
    description: "{{ doc('league_id') }}"
  - name: league_name
    description: League name.
  - name: division_id
    description: 'Division: E, C or W. NULL before divisions (1969).'
  - name: division_rank
    description: Finish in the division, or in the league before 1969.
  - name: g
    description: Games played.
  - name: g_home
    description: Home games.
  - name: w
    description: Wins.
  - name: l
    description: Losses.
  - name: win_pct
    description: Winning percentage.
  - name: r
    description: Runs scored.
  - name: ra
    description: Runs allowed.
  - name: run_diff
    description: Run differential, R - RA.
  - name: pythag_win_pct
    description: Pythagorean expected win percentage from runs scored and allowed (exponent 1.83).
  - name: won_division
    description: Won the division. NULL before divisions.
  - name: won_wild_card
    description: Won a wild card. NULL before wild cards (1995).
  - name: won_pennant
    description: Won the league pennant.
  - name: won_world_series
    description: Won the World Series.
  - name: ab
    description: Team at bats.
  - name: h
    description: Team hits.
  - name: doubles
    description: Team doubles.
  - name: triples
    description: Team triples.
  - name: hr
    description: Team home runs.
  - name: bb
    description: Team walks.
  - name: so
    description: Team strikeouts (batting).
  - name: sb
    description: Team stolen bases.
  - name: cs
    description: Team caught stealing.
  - name: hbp
    description: Team hit by pitch.
  - name: sf
    description: Team sacrifice flies.
  - name: avg
    description: Team batting average.
  - name: er
    description: Earned runs allowed.
  - name: era
    description: Team ERA.
  - name: cg
    description: Complete games.
  - name: sho
    description: Shutouts.
  - name: sv
    description: Saves.
  - name: ipouts
    description: Outs recorded by the team's pitchers.
  - name: ha
    description: Hits allowed.
  - name: hra
    description: Home runs allowed.
  - name: bba
    description: Walks allowed.
  - name: soa
    description: Strikeouts by pitchers.
  - name: e
    description: Errors.
  - name: dp
    description: Double plays turned.
  - name: fp
    description: Fielding percentage.
  - name: park_name
    description: Home ballpark.
  - name: attendance
    description: Home attendance.
  - name: batting_park_factor
    description: Three-year park factor for batters (100 = neutral).
  - name: pitching_park_factor
    description: Three-year park factor for pitchers (100 = neutral).
  - name: team_id_bbref
    description: Baseball-Reference team id.
  - name: team_id_retro
    description: Retrosheet team id.
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - season
        - team_id
- name: batting_seasons
  description: Regular-season batting, one row per player per season with all stints combined (a player traded mid-season

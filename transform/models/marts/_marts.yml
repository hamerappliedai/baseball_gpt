- name: awards
  description: Awards won by players and managers (MVP, Cy Young, Gold Glove, Silver Slugger, Manager of the Year,
    Triple Crown, ...). One row per award won.
  columns:
  - name: player_id
    description: "{{ doc('player_id') }}"
    data_tests:
    - not_null
    - *id001
  - name: full_name
    description: "{{ doc('full_name') }}"
  - name: recipient_type
    description: '''player'' or ''manager''.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - player
          - manager
  - name: award
    description: Award name, e.g. 'Most Valuable Player', 'Cy Young Award', 'Rookie of the Year', 'Gold Glove',
      'World Series MVP', 'Triple Crown'.
  - name: season
    description: "{{ doc('season') }}"
  - name: league_id
    description: League the award was given in; 'ML' for awards across both major leagues.
  - name: is_tie
    description: True when the award was shared.
  - name: notes
    description: Extra detail, e.g. Gold Glove position or Player of the Week date.
- name: award_voting
  description: Voting results for MVP, Cy Young and Rookie of the Year, one row per player who received votes.
  columns:
  - name: award
    description: '''Most Valuable Player'', ''Cy Young Award'' or ''Rookie of the Year''.'
  - name: season
    description: "{{ doc('season') }}"
  - name: league_id
    description: League; 'ML' where one award covered both leagues (Cy Young 1956-66, Rookie of the Year 1947-48).
  - name: player_id
    description: "{{ doc('player_id') }}"
    data_tests:
    - not_null
    - *id001
  - name: full_name
    description: "{{ doc('full_name') }}"
  - name: points_won
    description: Voting points received.
  - name: points_max
    description: Maximum possible points.
  - name: vote_share
    description: points_won / points_max.
  - name: first_place_votes
    description: First-place votes.
  - name: finish
    description: Finishing place in the vote (1 = winner; ties share a place).
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - award
        - season
        - league_id
        - player_id
- name: hall_of_fame_voting
  description: Hall of Fame ballots and selections, one row per person per year considered.
  columns:
  - name: player_id
    description: "{{ doc('player_id') }}"
    data_tests:
    - not_null
    - *id001
  - name: full_name
    description: "{{ doc('full_name') }}"
  - name: season
    description: "{{ doc('season') }}"
  - name: category
    description: Player, Manager, Executive, Pioneer/Executive, Pioneer or Umpire.
  - name: voted_by
    description: 'Electing body: ''BBWAA'', ''Veterans'', ''Negro League'', ''Special Election'', ...'
  - name: ballots
    description: Ballots cast. NULL for committee selections.
  - name: votes
    description: Votes received.
  - name: votes_needed
    description: Votes needed for induction (75%).
  - name: vote_pct
    description: votes / ballots.
  - name: is_inducted
    description: True if inducted that year.
  - name: needed_note
    description: Notes on unusual results.
- name: all_star_selections
  description: All-Star Game selections, one row per player per game.
  columns:
  - name: player_id
    description: "{{ doc('player_id') }}"
    data_tests:
    - not_null
    - *id001
  - name: full_name
    description: "{{ doc('full_name') }}"
  - name: season
    description: "{{ doc('season') }}"
  - name: game_num
    description: 0 for a single game; 1 or 2 in seasons with two All-Star Games (1959-62).
  - name: game_id
    description: Retrosheet game id. NULL for Negro Leagues all-star games.
  - name: team_id
    description: "{{ doc('team_id') }}"
  - name: league_id
    description: AL or NL; Negro Leagues East-West and North-South squads use EAS, WES, NOS, SAS, NNS, NNN.
  - name: played
    description: True if the player appeared in the game.
  - name: starting_position
    description: Fielding position number if the player started (1 = P ... 9 = RF, 10 = DH). A few rows hold two
      values separated by ';'.
- name: manager_seasons
  description: Managerial records, one row per manager, team and season (teams that changed managers mid-season
    have several rows).
  columns:
  - name: manager_id
    description: Person id of the manager; joins to players.player_id.
    data_tests:
    - relationships:
        arguments:
          to: ref('players')
          field: player_id
  - name: full_name
    description: "{{ doc('full_name') }}"
  - name: season
    description: "{{ doc('season') }}"
  - name: team_id
    description: "{{ doc('team_id') }}"
  - name: team_name
    description: Team name.
  - name: franchise_id
    description: Franchise id.
  - name: league_id
    description: "{{ doc('league_id') }}"
  - name: inseason
    description: Order of managers for that team in the season (1 = first).
  - name: g
    description: Games managed.
  - name: w
    description: Wins.
  - name: l
    description: Losses.
  - name: win_pct
    description: Winning percentage.
  - name: team_rank
    description: Team's final standing.
  - name: is_player_manager
    description: True if also a player that season.
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - manager_id
        - season
        - team_id
        - inseason
- name: salaries
  description: Player salaries in nominal US dollars. Covers 1985-2016 only.
  columns:
  - name: player_id
    description: "{{ doc('player_id') }}"
